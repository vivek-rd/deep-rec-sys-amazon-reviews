# m stands for model - i.e model parameters
m:
  # num_users: 1335228
  # num_products: 71254
  num_users: 159965
  num_products: 24546
  num_conv_filters: 60
  kernel_size: 3
  id_embed_dim: 16
  attention_vector_dim: 64
  feature_vector_dim: 16
  word_embed_dim: 300
  words_per_sentence: 12
  user_reviews_per_entity: 3
