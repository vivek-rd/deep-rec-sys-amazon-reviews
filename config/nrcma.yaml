t:
  batch_size: 64
  learning_rate: 0.0008
  num_epochs: 3
  random_seed: 42
  log_interval: 10
  checkpoint_dir: "checkpoints/"
  eval_iters: 500
  eval_batches: None
  checkpoint_iters: 500
  max_iters: None